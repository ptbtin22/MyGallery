name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2' # Support Xcode 16 project format 77

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null; then
            swiftlint lint --strict
          else
            echo "SwiftLint not pre-installed on this runner, skipping linting."
          fi

      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Xcode Derived Data
        uses: actions/cache@v4
        with:
          path: Build/DerivedData
          key: ${{ runner.os }}-derived-data-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Build and Test
        run: |
          xcodebuild test \
            -project PhotoGallery.xcodeproj \
            -scheme PhotoGallery \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath Build/DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO
